<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>页面不存在 · FX Hedge Lab</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1b1d21; --ink-2:#4a4f57; --ink-3:#767c86;
    --line:#e0dfda; --accent:#1f5f7a;
    --mono: ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --panel:#1c1f24; --ink:#ecedef; --ink-2:#b6bac1; --ink-3:#838995;
      --line:#2c3037; --accent:#7fc0dc; }
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); padding:24px;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:34px 36px; max-width:420px; }
  .code { font:600 11px/1 var(--mono); letter-spacing:.16em; color:var(--ink-3); margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { color:var(--ink-2); margin:0 0 18px; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404 · NOT FOUND</div>
    <h1>这个地址没有页面</h1>
    <p>这个站点只有一页演示内容。</p>
    <a href="/">回到 FX Hedge Lab 演示</a>
  </div>
</body>
</html>
